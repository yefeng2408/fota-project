server:
  port: 8082

spring:
  application:
    name: fota-mock-device-client

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 4
      connection-timeout: 30000

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      timeout: 5000

# 设备侧的对象存储服务
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  device-bucket-name: ${MINIO_DEVICE_BUCKET_NAME}

netty:
  device-gateway-server:
    host: ${MOCK_DEVICE_GATEWAY_HOST}
    port: ${MOCK_DEVICE_GATEWAY_PORT}
    endpoints: ${MOCK_DEVICE_GATEWAY_ENDPOINTS:}

logging:
  level:
    root: INFO
    com.yef: INFO
