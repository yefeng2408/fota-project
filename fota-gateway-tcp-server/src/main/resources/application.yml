server:
  port: 8081

netty:
  server:
    port: 7611

gateway:
  demo-upgrade:
    enabled: true
  instance:
    id: ${GATEWAY_INSTANCE_ID:}
    http-url: ${GATEWAY_INSTANCE_HTTP_URL:}
    tcp-host: ${GATEWAY_INSTANCE_TCP_HOST:}
    weight: ${GATEWAY_INSTANCE_WEIGHT:100}
    ttl-seconds: ${GATEWAY_INSTANCE_TTL_SECONDS:30}
    heartbeat-interval-ms: ${GATEWAY_INSTANCE_HEARTBEAT_INTERVAL_MS:10000}
  device-online:
    ttl-seconds: ${GATEWAY_DEVICE_ONLINE_TTL_SECONDS:240}
spring:
  application:
    name: fota-gateway
  redis:
    host: localhost
    port: 6379
    database: 0

# 对象存储服务
minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: fota-firmware
#Mybatis 驼峰
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: localhost:9876
  producer:
    group: fota-gateway-producer-group
  topic:
    upgrade-event: FOTA_UPGRADE_EVENT_TOPIC
