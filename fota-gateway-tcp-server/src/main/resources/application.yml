server:
  port: 8081

netty:
  server:
    port: 7611

gateway:
  demo-upgrade:
    enabled: true
spring:
  application:
    name: fota-gateway
  redis:
    host: localhost
    port: 6379
    database: 0

# 对象存储服务
minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: fota-firmware
#Mybatis 驼峰
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: localhost:9876
  producer:
    group: fota-gateway-producer-group
  topic:
    upgrade-event: FOTA_UPGRADE_EVENT_TOPIC
