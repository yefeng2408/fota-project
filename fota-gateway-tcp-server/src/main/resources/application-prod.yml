server:
  port: 8081

spring:
  application:
    name: fota-gateway-tcp-server

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 8
      connection-timeout: 30000

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      timeout: 5000

netty:
  server:
    port: ${FOTA_GATEWAY_PORT:8224}

# =========================
# MinIO 配置
# =========================
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:fota-gateway-producer-group}
  topic:
    upgrade-event: ${ROCKETMQ_UPGRADE_EVENT_TOPIC:FOTA_UPGRADE_EVENT_TOPIC}

# =========================
# 日志（先简单版）
# =========================
logging:
  level:
    root: INFO
    com.yef: INFO
