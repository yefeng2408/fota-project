server:
  port: 8081

spring:
  application:
    name: fota-gateway-tcp-server

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 8
      connection-timeout: 30000

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      timeout: 5000

# =========================
# Netty 网关配置
# =========================
fota:
  gateway:
    port: ${FOTA_GATEWAY_PORT:8224}
    boss-threads: 1
    worker-threads: 4

# =========================
# MinIO 配置
# =========================
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}

# =========================
# 升级推送（调用 http-server）
# =========================
device-upgrade:
  push-url: ${DEVICE_UPGRADE_PUSH_URL}

# =========================
# 日志（先简单版）
# =========================
logging:
  level:
    root: INFO
    com.yef: INFO