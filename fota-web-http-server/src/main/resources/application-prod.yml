server:
  port: 8080

spring:
  application:
    name: fota-web
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 8
      connection-timeout: 30000

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      timeout: 5000

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  device-bucket-name: ${MINIO_DEVICE_BUCKET_NAME:device-firmware}


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

gateway:
  http:
    url: ${GATEWAY_HTTP_URL}
  route:
    fallback-enabled: ${GATEWAY_ROUTE_FALLBACK_ENABLED:true}

mock:
  device:
    http:
      url: ${MOCK_DEVICE_HTTP_URL:http://fota-mock-device-client:8082}
      urls: ${MOCK_DEVICE_HTTP_URLS:}

forest:
  backend: okhttp3
  timeout:
    connect: 5000
    read: 20000
  variables:
    baseUrl: ${gateway.http.url}

logging:
  level:
    root: INFO
    com.yef: INFO

fota:
  upgrade:
    max-waiting-devices: 5000 # 等待升级状态的设备数
    max-active-devices: 500 # 允许同时并发升级的设备个数
    dispatch-batch-size: 200 #每次调度最多放多少设备进入升级，类似于线程池的每次 submit 数量

  jwt:
    secret: ${FOTA_JWT_SECRET}
    expire-hours: 12
  file-storage:
    path: /data/fota/files

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}
  consumer:
    group: ${ROCKETMQ_CONSUMER_GROUP:fota-web-upgrade-event-consumer-group}
  topic:
    upgrade-event: ${ROCKETMQ_UPGRADE_EVENT_TOPIC:FOTA_UPGRADE_EVENT_TOPIC}
