apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: nginx-ingress
  namespace: fota

spec:
  ingressClassName: nginx
  rules:
    #表示访问；http://nginx.fota.local 进入 nginx-service
  - host: nginx.fota.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80