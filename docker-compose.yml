services:

  mysql:
    image: mysql:8.0
    #image: registry.cn-hangzhou.aliyuncs.com/library/mysql:8.0
    container_name: fota-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fota_web_platform}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./ddl/fota_web_platform.sql:/docker-entrypoint-initdb.d/001_fota_web_platform.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fota-net

  redis:
    image: redis:7.2
    #image: registry.cn-hangzhou.aliyuncs.com/library/redis:7.2
    container_name: fota-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/redis-cli ping"]
      #test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fota-net

  minio:
    image: minio/minio:latest
    #image: quay.io/minio/minio:latest
    container_name: fota-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - fota-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.0
    container_name: fota-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    volumes:
      - ./data/rocketmq/namesrv/logs:/home/rocketmq/logs
    networks:
      - fota-net

  rocketmq-broker:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    image: apache/rocketmq:5.1.0
    container_name: fota-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: ${JAVA_OPTS_ROCKETMQ_BROKER:--Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=256m}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["sh", "mqbroker", "-c", "/home/rocketmq/conf/broker.conf"]
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_HA_PORT:-10912}:10912"
      - "${ROCKETMQ_BROKER_VIP_PORT:-10909}:10909"
    volumes:
      - ./data/rocketmq/broker/logs:/home/rocketmq/logs
      - ./data/rocketmq/broker/store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    networks:
      - fota-net

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: fota-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m -Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dserver.port=8082"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ROCKETMQ_DASHBOARD_PORT:-18082}:8082"
    networks:
      - fota-net

  fota-web-http-server:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    image: fota-web:v1
    container_name: fota-web-http-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS_WEB:--Xms256m -Xmx512m}

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fota_web_platform}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}

      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      ROCKETMQ_PRODUCER_GROUP: fota-web-producer-group
      ROCKETMQ_CONSUMER_GROUP: fota-web-upgrade-event-consumer-group

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-fota-firmware}
      MINIO_DEVICE_BUCKET_NAME: ${MINIO_DEVICE_BUCKET_NAME:-device-firmware}

      GATEWAY_HTTP_URL: http://fota-gateway-tcp-server:8081
      MOCK_DEVICE_HTTP_URL: http://fota-mock-device-client:8082

      FOTA_JWT_SECRET: ${FOTA_JWT_SECRET:-your-prod-jwt-secret-change-me}
    ports:
      - "${WEB_HTTP_PORT:-8080}:8080"
    networks:
      - fota-net

  fota-gateway-tcp-server:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    image: fota-gateway:v1
    container_name: fota-gateway-tcp-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      rocketmq-broker:
        condition: service_started
      fota-web-http-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS_GATEWAY:--Xms1024m -Xmx1024m}

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fota_web_platform}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}

      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      ROCKETMQ_PRODUCER_GROUP: fota-gateway-producer-group

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-fota-firmware}

      FOTA_GATEWAY_PORT: ${FOTA_GATEWAY_PORT:-8224}
      GATEWAY_INSTANCE_ID: ${GATEWAY_INSTANCE_ID:-fota-gateway-tcp-server}
      GATEWAY_INSTANCE_HTTP_URL: ${GATEWAY_INSTANCE_HTTP_URL:-http://fota-gateway-tcp-server:8081}
      GATEWAY_INSTANCE_TCP_HOST: ${GATEWAY_INSTANCE_TCP_HOST:-fota-gateway-tcp-server}
    ports:
      - "${FOTA_GATEWAY_PORT:-8224}:${FOTA_GATEWAY_PORT:-8224}"
      - "${GATEWAY_HTTP_PORT:-8081}:8081"
    networks:
      - fota-net

  fota-mock-device-client:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    #profiles: ["mock"]
    image: fota-device:v1
    container_name: fota-mock-device-client
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      fota-gateway-tcp-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS_MOCK:--Xms1024m -Xmx2048m}

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fota_web_platform}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_DEVICE_BUCKET_NAME: ${MINIO_DEVICE_BUCKET_NAME:-device-firmware}

      MOCK_DEVICE_GATEWAY_HOST: fota-gateway-tcp-server
      MOCK_DEVICE_GATEWAY_PORT: ${FOTA_GATEWAY_PORT:-8224}

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
    networks:
      - fota-net

  nginx:
    image: fota-web-admin-nginx:v3
    container_name: fota-nginx
    restart: unless-stopped
    depends_on:
      - fota-web-http-server
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - fota-net

networks:
  fota-net:
    driver: bridge
