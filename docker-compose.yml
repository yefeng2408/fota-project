version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: fota-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: fota_web_platform
      TZ: Asia/Shanghai
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - fota-net

  redis:
    image: redis:7.2
    container_name: fota-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - fota-net

  minio:
    image: minio/minio:latest
    container_name: fota-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - fota-net

  fota-web-http-server:
    image: fota-web-http-server:latest
    container_name: fota-web-http-server
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - minio
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m"

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fota_web_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: fota-firmware

      GATEWAY_HTTP_URL: http://fota-gateway-tcp-server:8081
      FOTA_JWT_SECRET: your-prod-jwt-secret-change-me

      GATEWAY_INTERNAL_BASE_URL: http://fota-gateway-tcp-server:8081
    ports:
      - "8080:8080"
    networks:
      - fota-net

  fota-gateway-tcp-server:
    image: fota-gateway-tcp-server:latest
    container_name: fota-gateway-tcp-server
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - minio
      - fota-web-http-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m"

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fota_web_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: fota-firmware

      DEVICE_UPGRADE_PUSH_URL: http://fota-web-http-server:8080/internal/device-upgrade/event
    ports:
      - "8224:8224"
      - "8081:8081"
    networks:
      - fota-net

  fota-mock-device-client:
    image: fota-mock-device-client:latest
    container_name: fota-mock-device-client
    restart: unless-stopped
    depends_on:
      - fota-gateway-tcp-server
      - mysql
      - redis
      - minio
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms128m -Xmx256m"

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fota_web_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: device-firmware

      MOCK_DEVICE_GATEWAY_HOST: fota-gateway-tcp-server
      MOCK_DEVICE_GATEWAY_PORT: 8224
    networks:
      - fota-net

  nginx:
    image: nginx:1.27
    container_name: fota-nginx
    restart: unless-stopped
    depends_on:
      - fota-web-http-server
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fota-web-admin/dist:/usr/share/nginx/html:ro
    networks:
      - fota-net

networks:
  fota-net:
    driver: bridge