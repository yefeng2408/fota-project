services:

  mysql:
    image: mysql:8.0
    #image: registry.cn-hangzhou.aliyuncs.com/library/mysql:8.0
    container_name: fota-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fota_web_platform}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./ddl/fota_web_platform.sql:/docker-entrypoint-initdb.d/001_fota_web_platform.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fota-net

  redis:
    image: redis:7.2
    #image: registry.cn-hangzhou.aliyuncs.com/library/redis:7.2
    container_name: fota-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/redis-cli ping"]
      #test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fota-net

  minio:
    image: minio/minio:latest
    #image: quay.io/minio/minio:latest
    container_name: fota-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - fota-net

  fota-web-http-server:
    image: fota-web-http-server:v1
    container_name: fota-web-http-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS_WEB:--Xms256m -Xmx512m}

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fota_web_platform}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-fota-firmware}
      MINIO_DEVICE_BUCKET_NAME: ${MINIO_DEVICE_BUCKET_NAME:-device-firmware}

      GATEWAY_HTTP_URL: http://fota-gateway-tcp-server:8081
      MOCK_DEVICE_HTTP_URL: http://fota-mock-device-client:8082

      FOTA_JWT_SECRET: ${FOTA_JWT_SECRET:-your-prod-jwt-secret-change-me}
    ports:
      - "${WEB_HTTP_PORT:-8080}:8080"
    networks:
      - fota-net

  fota-gateway-tcp-server:
    image: fota-gateway-tcp-server:v1
    container_name: fota-gateway-tcp-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      fota-web-http-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS_GATEWAY:--Xms256m -Xmx512m}

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fota_web_platform}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-fota-firmware}

      DEVICE_UPGRADE_PUSH_URL: http://fota-web-http-server:8080/internal/device-upgrade/event
      DEVICE_UPGRADE_RESULT_URL: http://fota-web-http-server:8080/internal/device-upgrade/result
      DEVICE_UPGRADE_CANCEL_URL: http://fota-web-http-server:8080/internal/device-upgrade/cancel
      DEVICE_UPGRADE_START_URL: http://fota-web-http-server:8080/internal/device-upgrade/start-time
      FOTA_GATEWAY_PORT: ${FOTA_GATEWAY_PORT:-8224}
    ports:
      - "${FOTA_GATEWAY_PORT:-8224}:${FOTA_GATEWAY_PORT:-8224}"
      - "${GATEWAY_HTTP_PORT:-8081}:8081"
    networks:
      - fota-net

  fota-mock-device-client:
    #profiles: ["mock"]
    image: fota-mock-device-client:v1
    container_name: fota-mock-device-client
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      fota-gateway-tcp-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS_MOCK:--Xms128m -Xmx256m}

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fota_web_platform}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_DEVICE_BUCKET_NAME: ${MINIO_DEVICE_BUCKET_NAME:-device-firmware}

      MOCK_DEVICE_GATEWAY_HOST: fota-gateway-tcp-server
      MOCK_DEVICE_GATEWAY_PORT: ${FOTA_GATEWAY_PORT:-8224}
    networks:
      - fota-net

  nginx:
    image: fota-web-admin-nginx:v1
    container_name: fota-nginx
    restart: unless-stopped
    depends_on:
      - fota-web-http-server
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - fota-net

networks:
  fota-net:
    driver: bridge
