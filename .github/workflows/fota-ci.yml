name: FOTA CI

on:
  workflow_dispatch:
#私有docker镜像仓库
env:
  REGISTRY: 192.168.0.103:5000

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "===== Runner Info ====="
          hostname
          whoami
          pwd
          java -version
          mvn -version
          docker --version

      - name: Show project files
        run: |
          ls -la

      - name: Maven build
        run: |
          mvn clean package -DskipTests

      - name: Prepare image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}"
      #=============== fota-web ======================
      #docker build fota-web-http-server
      - name: Docker build fota-web-http-server
        run: |
          docker build \
            -t "${REGISTRY}/fota-web-http-server:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-web-http-server:dev-latest" \
            ./fota-web-http-server
      #docker push fota-web-http-server
      - name: Docker push fota-web-http-server
        run: |
          docker push "${REGISTRY}/fota-web-http-server:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-web-http-server:dev-latest"
          
      #=============== fota-gateway ======================
      - name: Docker build fota-gateway-tcp-server
        run: |
          docker build \
            -t "${REGISTRY}/fota-gateway-tcp-server:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-gateway-tcp-server:dev-latest" \
            ./fota-gateway-tcp-server

      - name: Docker push fota-gateway-tcp-server
        run: |
          docker push "${REGISTRY}/fota-gateway-tcp-server:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-gateway-tcp-server:dev-latest"

      #=============== fota-mock-device ======================
      - name: Docker build fota-mock-device-client
        run: |
          docker build \
            -t "${REGISTRY}/fota-mock-device-client:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-mock-device-client:dev-latest" \
            ./fota-mock-device-client

      - name: Docker push fota-mock-device-client
        run: |
          docker push "${REGISTRY}/fota-mock-device-client:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-mock-device-client:dev-latest"

      # ================= fota-web-admin =================
      #前端ci流程如下：
      # ① 前端目录
#      cd ~/actions-runner/_work/fota-project/fota-project/fota-web-admin
#
#      # ② 安装依赖
#      npm ci
#
#      # ③ Vue/Vite 打包
#      npm run build
#
#      # ④ 确认 dist 已生成
#      ls -lh dist
#
#      # ⑤ 回项目根目录
#      cd ..
#
#      # ⑥ 构建 Nginx 前端镜像
#      docker build \
#      -f docker/nginx/Dockerfile \
#      -t 192.168.0.103:5000/fota-web-admin-nginx:test \
#      .
#
#      # ⑦ 推送
#      docker push 192.168.0.103:5000/fota-web-admin-nginx:test
      - name: Build fota-web-admin
        working-directory: ./fota-web-admin
        run: |
          npm ci
          npm run build

      - name: Docker build fota-web-admin
        run: |
          docker build \
            -f docker/nginx/Dockerfile \
            -t "${REGISTRY}/fota-web-admin-nginx:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-web-admin-nginx:dev-latest" \
            .

      - name: Docker push fota-web-admin
        run: |
          docker push "${REGISTRY}/fota-web-admin-nginx:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-web-admin-nginx:dev-latest"
          
