name: FOTA CI

on:
  workflow_dispatch:
#私有docker镜像仓库
env:
  REGISTRY: 192.168.0.103:5000

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "===== Runner Info ====="
          hostname
          whoami
          pwd
          java -version
          mvn -version
          docker --version

      - name: Show project files
        run: |
          ls -la

      - name: Maven build
        run: |
          mvn clean package -DskipTests

      - name: Prepare image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}"

      - name: Docker build fota-web-http-server
        run: |
          docker build \
            -t "${REGISTRY}/fota-web-http-server:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-web-http-server:dev-latest" \
            ./fota-web-http-server

      - name: Docker push fota-web-http-server
        run: |
          docker push "${REGISTRY}/fota-web-http-server:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-web-http-server:dev-latest"