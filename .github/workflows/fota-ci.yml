name: FOTA CI

permissions:
  contents: write

on:
  push:
    branches:
      - test
    paths-ignore:
      - 'helm/**'
  workflow_dispatch:

# ================= 全局环境变量 =================
# REGISTRY：家庭 Ubuntu 主机上的 Docker 私有镜像仓库
env:
  REGISTRY: 192.168.0.103:5000

jobs:
  build:
    runs-on: self-hosted

    steps:
      # ================= 1. Checkout =================
      - name: Checkout source
        uses: actions/checkout@v4

      # ================= 2. Runner 环境检查 =================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show runner info
        run: |
          echo "===== Runner Info ====="
          hostname
          whoami
          pwd
          java -version
          mvn -version
          node -v
          npm -v
          docker --version
          python3 --version

      - name: Show project files
        run: |
          ls -la

      # ================= 3. Maven 多模块构建 =================
      # 一次性编译三个 Java 业务服务，生成各模块 target/*.jar
      - name: Maven build
        run: |
          mvn clean package -DskipTests

      # ================= 4. 生成本次镜像版本号 =================
      # 使用 Git commit SHA 前 7 位作为不可变镜像版本，例如：5c59eb0
      # 同一个 IMAGE_TAG 会贯穿 Docker Registry、Helm 和 K8s Pod
      - name: Prepare image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}"

      # ================= 5. fota-web-http-server =================
      - name: Docker build fota-web-http-server
        run: |
          docker build \
            -t "${REGISTRY}/fota-web-http-server:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-web-http-server:test-latest" \
            ./fota-web-http-server

      - name: Docker push fota-web-http-server
        run: |
          docker push "${REGISTRY}/fota-web-http-server:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-web-http-server:test-latest"

      # ================= 6. fota-gateway-tcp-server =================
      - name: Docker build fota-gateway-tcp-server
        run: |
          docker build \
            -t "${REGISTRY}/fota-gateway-tcp-server:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-gateway-tcp-server:test-latest" \
            ./fota-gateway-tcp-server

      - name: Docker push fota-gateway-tcp-server
        run: |
          docker push "${REGISTRY}/fota-gateway-tcp-server:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-gateway-tcp-server:test-latest"

      # ================= 7. fota-mock-device-client =================
      - name: Docker build fota-mock-device-client
        run: |
          docker build \
            -t "${REGISTRY}/fota-mock-device-client:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-mock-device-client:test-latest" \
            ./fota-mock-device-client

      - name: Docker push fota-mock-device-client
        run: |
          docker push "${REGISTRY}/fota-mock-device-client:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-mock-device-client:test-latest"

      # ================= 8. fota-web-admin =================
      # 前端构建流程：
      # npm ci -> vite build -> dist -> Nginx 镜像
      - name: Build fota-web-admin
        working-directory: ./fota-web-admin
        run: |
          npm ci
          npm run build

      # 当前前端 Dockerfile 位于 docker/nginx/Dockerfile
      #
      # Dockerfile 会读取：
      #   docker/nginx/conf.d/default.conf
      #   fota-web-admin/dist
      #
      # 因此 Docker build context 必须使用项目根目录 "."
      - name: Docker build fota-web-admin
        run: |
          docker build \
            -f docker/nginx/Dockerfile \
            -t "${REGISTRY}/fota-web-admin-nginx:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-web-admin-nginx:test-latest" \
            .

      - name: Docker push fota-web-admin
        run: |
          docker push "${REGISTRY}/fota-web-admin-nginx:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-web-admin-nginx:test-latest"

      # ================= 9. 更新 Helm 镜像版本 =================
      #
      # 当前采用“源码与 GitOps 配置同仓库、同 test 分支”的过渡方案：
      # CI 构建并推送镜像后，将四个 Helm values.yaml 的 image.tag 更新为本次 Git SHA，
      # 再由 Argo CD 读取 Git 中的期望状态完成部署。
      #
      # 为避免开发者提交和 github-actions[bot] 提交同时更新 dev 导致 non-fast-forward：
      # 1. 修改 Helm 前 fetch + rebase 到最新 origin/test
      # 2. commit 后 push 前再次 fetch + rebase，缩小并发窗口
      # 3. 若远端也修改了同一 values.yaml，则 rebase 冲突并让 CI 失败，禁止自动覆盖
      #
      # 长期建议：将 Helm/GitOps 配置迁移到独立 config repo（或独立 GitOps 分支），
      # 源码 CI 只负责 build/push 镜像，配置仓库单独记录 image.tag，
      # 彻底消除 bot commit 与源码 commit 竞争。
      - name: Update Helm image tags
        run: |
          set -euo pipefail

          echo "===== Sync latest test before updating Helm tags ====="
          git fetch origin test
          git rebase origin/test

          python3 - <<'PY'
          import os
          from pathlib import Path

          image_tag = os.environ["IMAGE_TAG"]

          files = [
              Path("helm/fota-platform/values.yaml"),
              Path("helm/fota-gateway/values.yaml"),
              Path("helm/fota-mock-device/values.yaml"),
              Path("helm/fota-web-admin/values.yaml"),
          ]

          for path in files:
              lines = path.read_text().splitlines(keepends=True)

              in_image = False
              changed = False

              for i, line in enumerate(lines):
                  if line.startswith("image:"):
                      in_image = True
                      continue

                  if in_image and line and not line[0].isspace():
                      in_image = False

                  if in_image and line.lstrip().startswith("tag:"):
                      indent = line[:len(line) - len(line.lstrip())]
                      newline = "\n" if line.endswith("\n") else ""
                      lines[i] = f"{indent}tag: {image_tag}{newline}"
                      changed = True
                      break

              if not changed:
                  raise RuntimeError(f"image.tag not found: {path}")

              path.write_text("".join(lines))
              print(f"{path}: image.tag -> {image_tag}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            helm/fota-platform/values.yaml \
            helm/fota-gateway/values.yaml \
            helm/fota-mock-device/values.yaml \
            helm/fota-web-admin/values.yaml

          if git diff --cached --quiet; then
            echo "Helm image tags are already up to date; nothing to commit."
            exit 0
          fi

          git commit -m "chore(helm): update image tags to ${IMAGE_TAG}"

          echo "===== Sync latest test again before push ====="
          git fetch origin test
          git rebase origin/test

          git remote set-url origin https://github.com/yefeng2408/fota-project.git
          git push origin HEAD:test