name: FOTA CI

permissions:
  contents: write

on:
  workflow_dispatch:

# ================= 全局环境变量 =================
# REGISTRY：家庭 Ubuntu 主机上的 Docker 私有镜像仓库
# K8S_MASTER：k8s-master 的 Tailscale IP
# K8S_USER：SSH 登录 k8s-master 的 Linux 用户
env:
  REGISTRY: 192.168.0.103:5000
  K8S_MASTER: 100.87.149.123
  K8S_USER: feng

jobs:
  build:
    runs-on: self-hosted

    steps:
      # ================= 1. Checkout =================
      - name: Checkout source
        uses: actions/checkout@v4

      # ================= 2. Runner 环境检查 =================
      - name: Show runner info
        run: |
          echo "===== Runner Info ====="
          hostname
          whoami
          pwd
          java -version
          mvn -version
          node -v
          npm -v
          docker --version
          python3 --version

      - name: Show project files
        run: |
          ls -la

      # ================= 3. Maven 多模块构建 =================
      # 一次性编译三个 Java 业务服务，生成各模块 target/*.jar
      - name: Maven build
        run: |
          mvn clean package -DskipTests

      # ================= 4. 生成本次镜像版本号 =================
      # 使用 Git commit SHA 前 7 位作为不可变镜像版本，例如：5c59eb0
      # 同一个 IMAGE_TAG 会贯穿 Docker Registry、Helm 和 K8s Pod
      - name: Prepare image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}"

      # ================= 5. fota-web-http-server =================
      - name: Docker build fota-web-http-server
        run: |
          docker build \
            -t "${REGISTRY}/fota-web-http-server:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-web-http-server:dev-latest" \
            ./fota-web-http-server

      - name: Docker push fota-web-http-server
        run: |
          docker push "${REGISTRY}/fota-web-http-server:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-web-http-server:dev-latest"

      # ================= 6. fota-gateway-tcp-server =================
      - name: Docker build fota-gateway-tcp-server
        run: |
          docker build \
            -t "${REGISTRY}/fota-gateway-tcp-server:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-gateway-tcp-server:dev-latest" \
            ./fota-gateway-tcp-server

      - name: Docker push fota-gateway-tcp-server
        run: |
          docker push "${REGISTRY}/fota-gateway-tcp-server:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-gateway-tcp-server:dev-latest"

      # ================= 7. fota-mock-device-client =================
      - name: Docker build fota-mock-device-client
        run: |
          docker build \
            -t "${REGISTRY}/fota-mock-device-client:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-mock-device-client:dev-latest" \
            ./fota-mock-device-client

      - name: Docker push fota-mock-device-client
        run: |
          docker push "${REGISTRY}/fota-mock-device-client:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-mock-device-client:dev-latest"

      # ================= 8. fota-web-admin =================
      # 前端构建流程：
      # npm ci -> vite build -> dist -> Nginx 镜像
      - name: Build fota-web-admin
        working-directory: ./fota-web-admin
        run: |
          npm ci
          npm run build

      # 当前前端 Dockerfile 位于 docker/nginx/Dockerfile
      #
      # Dockerfile 会读取：
      #   docker/nginx/conf.d/default.conf
      #   fota-web-admin/dist
      #
      # 因此 Docker build context 必须使用项目根目录 "."
      - name: Docker build fota-web-admin
        run: |
          docker build \
            -f docker/nginx/Dockerfile \
            -t "${REGISTRY}/fota-web-admin-nginx:${IMAGE_TAG}" \
            -t "${REGISTRY}/fota-web-admin-nginx:dev-latest" \
            .

      - name: Docker push fota-web-admin
        run: |
          docker push "${REGISTRY}/fota-web-admin-nginx:${IMAGE_TAG}"
          docker push "${REGISTRY}/fota-web-admin-nginx:dev-latest"

      # ================= 9. 更新 Helm 镜像版本 =================
      #
      # 将四个 Helm values.yaml 中 image.tag 更新为本次 Git SHA。
      #
      # Runner 已安装 Python 3，因此统一使用 python3。
      #
      # 修改完成后：
      # 1. git add Helm values.yaml
      # 2. 有变化才 commit
      # 3. push 到 dev 分支
      - name: Update Helm image tags
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          image_tag = os.environ["IMAGE_TAG"]

          files = [
              Path("helm/fota-platform/values.yaml"),
              Path("helm/fota-gateway/values.yaml"),
              Path("helm/fota-mock-device/values.yaml"),
              Path("helm/fota-web-admin/values.yaml"),
          ]

          for path in files:
              lines = path.read_text().splitlines(keepends=True)

              in_image = False
              changed = False

              for i, line in enumerate(lines):
                  if line.startswith("image:"):
                      in_image = True
                      continue

                  if in_image and line and not line[0].isspace():
                      in_image = False

                  if in_image and line.lstrip().startswith("tag:"):
                      indent = line[:len(line) - len(line.lstrip())]
                      newline = "\n" if line.endswith("\n") else ""
                      lines[i] = f"{indent}tag: {image_tag}{newline}"
                      changed = True
                      break

              if not changed:
                  raise RuntimeError(f"image.tag not found: {path}")

              path.write_text("".join(lines))
              print(f"{path}: image.tag -> {image_tag}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            helm/fota-platform/values.yaml \
            helm/fota-gateway/values.yaml \
            helm/fota-mock-device/values.yaml \
            helm/fota-web-admin/values.yaml

          git diff --cached --quiet || \
            git commit -m "chore(helm): update image tags to ${IMAGE_TAG}"

          git remote set-url origin https://github.com/yefeng2408/fota-project.git
          git push origin HEAD:dev

      # ================= 10. Deploy to Kubernetes =================
      #
      # 当前架构：
      #
      # GitHub Actions
      #       ↓
      # Ubuntu Self-hosted Runner
      #       ↓
      # Docker build / push
      #       ↓
      # SSH over Tailscale
      #       ↓
      # k8s-master
      #       ↓
      # Helm upgrade
      #       ↓
      # Kubernetes Deployment
      #
      # Runner 本机不安装 helm / kubectl。
      # 通过 SSH 登录 k8s-master，由 master 节点执行 Helm。
      #
      # SSH 私钥：
      # /home/yefeng/.ssh/fota_ci_k8s
      #
      # 私钥只保存在 Runner 主机，禁止提交到 GitHub。
      #
      # 部署策略：
      # 1. 四个业务服务统一使用本次 Git SHA 对应的 IMAGE_TAG
      # 2. --reuse-values 保留已有 Helm Release 配置
      # 3. --set-string 只覆盖 image.repository / image.tag
      # 4. --atomic 单个 Release 升级失败时自动回滚
      # 5. rollout status 确认 Deployment 真正完成滚动升级
      # 6. set -euo pipefail 保证任意命令失败时 CI 立即失败
      - name: Deploy to Kubernetes
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Start Kubernetes deployment"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "K8S_MASTER=${K8S_MASTER}"
          echo "======================================"

          ssh \
            -i "$HOME/.ssh/fota_ci_k8s" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${K8S_USER}@${K8S_MASTER}" \
            "IMAGE_TAG='${IMAGE_TAG}' bash -s" <<'REMOTE'

          set -euo pipefail

          echo "======================================"
          echo "Remote host: $(hostname)"
          echo "Deploy FOTA version: ${IMAGE_TAG}"
          echo "======================================"

          # ==================================================
          # 通用 Helm 部署函数
          #
          # 参数：
          # $1 RELEASE      Helm Release 名称
          # $2 CHART        k8s-master 本地 Helm Chart 路径
          # $3 REPOSITORY   Docker Registry 镜像仓库
          # $4 DEPLOYMENT   Kubernetes Deployment 名称
          # ==================================================
          deploy() {
            RELEASE="$1"
            CHART="$2"
            REPOSITORY="$3"
            DEPLOYMENT="$4"

            echo
            echo "======================================"
            echo "Deploying release: ${RELEASE}"
            echo "Chart: ${CHART}"
            echo "Image: ${REPOSITORY}:${IMAGE_TAG}"
            echo "======================================"

            helm upgrade --install "${RELEASE}" "${CHART}" \
              -n fota \
              --reuse-values \
              --set-string image.repository="${REPOSITORY}" \
              --set-string image.tag="${IMAGE_TAG}" \
              --atomic \
              --timeout 180s

            kubectl rollout status \
              "deployment/${DEPLOYMENT}" \
              -n fota \
              --timeout=120s
          }

          # ================= fota-web-http-server =================
          deploy \
            fota-platform \
            /home/feng/k8s/helm/fota-platform \
            192.168.0.103:5000/fota-web-http-server \
            fota-platform

          # ================= fota-gateway-tcp-server =================
          deploy \
            fota-gateway \
            /home/feng/k8s/helm/fota-gateway \
            192.168.0.103:5000/fota-gateway-tcp-server \
            fota-gateway

          # ================= fota-mock-device-client =================
          deploy \
            fota-mock-device \
            /home/feng/k8s/helm/fota-mock-device \
            192.168.0.103:5000/fota-mock-device-client \
            fota-mock-device

          # ================= fota-web-admin-nginx =================
          deploy \
            fota-web-admin \
            /home/feng/k8s/helm/fota-web-admin \
            192.168.0.103:5000/fota-web-admin-nginx \
            fota-web-admin

          # ================= 最终部署验收 =================
          #
          # 输出 namespace=fota 下 Deployment 实际使用的镜像。
          #
          # 正常情况下，四个业务 Deployment 都应该指向：
          # :${IMAGE_TAG}
          echo
          echo "======================================"
          echo "All business services deployed"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "======================================"

          kubectl get deploy -n fota \
            -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image

          REMOTE